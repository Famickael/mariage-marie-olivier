<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marie &amp; Olivier</title>
<link rel="icon" type="image/png" href="../assets/favicon.png">
<link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
<link rel="stylesheet" href="../assets/charte.css?v=202610241707">
<style>
  main{max-width:560px;margin:0 auto;padding:30px 16px 70px}
  .jour{margin-top:40px;text-align:center}
  .jour h2{font-size:1.9rem;font-style:italic}
  ol{list-style:none;padding:0;margin:20px 0 0}
  li.moment{text-align:center;padding:16px 0;position:relative}
  li.moment + li.moment::before{content:"✦";display:block;color:var(--or);font-size:.7rem;margin:-6px 0 14px}
  .moment .heure{letter-spacing:.3em;font-size:.95rem;color:var(--bleu)}
  .moment h3{font-size:1.7rem;margin-top:2px}
  .moment .lieu{font-style:italic;color:var(--encre-douce)}
  .moment .desc{max-width:420px;margin:6px auto 0;font-size:.98rem;white-space:pre-wrap}
  .moment.encours h3{color:var(--or)}
  .moment.encours .heure::after{content:" · en ce moment";letter-spacing:.1em;font-style:italic;color:var(--or)}
  .vide{text-align:center;font-style:italic;color:var(--encre-douce);margin:40px 0}
  .papillon{display:block;width:44px;margin:40px auto 0;opacity:.8}
</style>
</head>
<body>
<main>
  <header class="entete-site" data-titre="Le programme" data-sous="Le déroulé du week-end, heure par heure.<br>Les horaires et les lieux de chaque moment, de la cérémonie au lendemain."></header>
  <div id="jours"></div>
  <span id="pap"></span>
</main>
<footer class="pied-bleu" id="pied"></footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="../assets/commun.js?v=202610241707"></script>
<script src="../assets/ouverture.js?v=202610241707"></script>
<script src="../assets/programme.js?v=202610241707"></script>
<script>
$('#pap').remove();
$('#pied').innerHTML = piedBleu();
/* Page invités : client sans session, seuls les moments « visibles des invités ». */
const sbInvite = CONFIGURE ? window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY, { auth: { persistSession: false } }) : null;
let items = [];
async function charger(){
  if (!sbInvite) return;
  const publie = await reglage('programme_publie', false);
  if (!publie) { $('#jours').innerHTML = '<p class="vide">Le programme est en préparation : Marie et Olivier le dévoileront quelques semaines avant le mariage.<br>Revenez faire un tour ici en décembre !</p>'; return; }
  const { data, error } = await sbInvite.from('mo_programme').select('jour,debut,duree,titre,lieu,description').eq('public', true).order('jour').order('debut');
  if (error) { $('#jours').innerHTML = '<p class="vide">Le programme n\'est pas disponible pour le moment, réessayez un peu plus tard.</p>'; return; }
  items = data; rendre();
}
function rendre(){
  const cont = $('#jours'); cont.innerHTML = '';
  const auj = jourLogique(new Date()), now = minutesMaintenant();
  for (const [v, l] of JOURS) {
    const liste = items.filter(i => i.jour === v).sort((a, b) => minutes(a) - minutes(b));
    if (!liste.length) continue;
    const sec = document.createElement('section'); sec.className = 'jour';
    sec.innerHTML = `<p class="capitales">${l.split(' ')[0]}</p><h2>${l.split(' ').slice(1).join(' ')}</h2><ol></ol>`;
    for (const it of liste) {
      const d = minutes(it), enCours = v === auj && now >= d && now < d + (it.duree || 0);
      sec.querySelector('ol').insertAdjacentHTML('beforeend', `<li class="moment${enCours ? ' encours' : ''}">
        <div class="heure">${fmtH(d)}</div><h3>${echap(it.titre)}</h3>
        ${it.lieu ? `<div class="lieu">${echap(it.lieu)}</div>` : ''}${it.description ? `<div class="desc">${echap(it.description)}</div>` : ''}</li>`);
    }
    cont.appendChild(sec);
  }
  if (!cont.children.length) cont.innerHTML = '<p class="vide">Le programme est en préparation : Marie et Olivier le dévoileront quelques semaines avant le mariage.<br>Revenez faire un tour ici en décembre !</p>';
}
charger(); setInterval(charger, 120000);
</script>
</body>
</html>
