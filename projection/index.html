<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Marie &amp; Olivier</title>
<link rel="icon" type="image/png" href="../assets/favicon.png">
<link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
<link rel="stylesheet" href="../assets/charte.css?v=202611051400">
<style>
  html,body{height:100%;overflow:hidden}
  body{background:radial-gradient(ellipse at 50% 40%,#fbfaf7,var(--satin) 60%,var(--perle) 100%)}
  body.plein{cursor:none}
  #scene{position:absolute;inset:0}
  .coin{position:absolute;opacity:.9;pointer-events:none}
  .coin.hg{width:22vmin;top:-1vmin;left:-1vmin}
  .coin.bd{width:24vmin;bottom:-2vmin;left:0}
  .coin.hd{width:26vmin;top:1vmin;right:18vmin}
  .bandeau{position:absolute;left:0;right:0;bottom:1.2vmin;text-align:center;pointer-events:none}
  .bandeau .monogramme{font-size:4vmin}
  .bandeau .capitales{font-size:1.2vmin;margin-left:1.5vmin;vertical-align:.6vmin}
  #qr-coin{position:absolute;right:2vmin;bottom:2vmin;background:#fff;padding:1vmin;box-shadow:var(--ombre);text-align:center}
  #qr-coin .capitales{font-size:1.25vmin;letter-spacing:.18em;margin-top:.7vmin;max-width:14vmin;margin-left:auto;margin-right:auto;line-height:1.5}
  #qr-coin img,#qr-coin canvas{width:14vmin!important;height:14vmin!important;display:block}

  #diapos{position:absolute;inset:3vmin 18vmin 9vmin 18vmin;display:flex;align-items:center;justify-content:center}
  /* Les photos sont « posées sur une table » : la nouvelle arrive de l'avant (grande, floue d'ombre, transparente)
     et se pose au centre ; les précédentes glissent vers les bords, plus petites, et restent visibles derrière. */
  .diapo{position:absolute;display:flex;align-items:center;justify-content:center;
    --s:1.35;opacity:0;transform:translate(var(--dx,0),var(--dy,0)) rotate(var(--rot,0deg)) scale(var(--s));
    transition:opacity 1.1s ease,transform 1.6s cubic-bezier(.16,.84,.24,1),filter 1.4s ease}
  .diapo.visible{--s:1;opacity:1}
  .diapo.dessous{--s:var(--s-dessous,.58);filter:brightness(.9) saturate(.8)}
  .diapo.sortie{opacity:0;transition:opacity 1.4s ease}
  .cadre-photo{position:relative;background:#fff;padding:1vmin;box-shadow:0 5vmin 9vmin rgba(27,38,82,.18),0 1vmin 2vmin rgba(27,38,82,.12);transition:box-shadow 1.6s ease}
  .diapo.visible .cadre-photo{box-shadow:0 1.2vmin 3.2vmin rgba(27,38,82,.28),0 .2vmin .6vmin rgba(27,38,82,.22)}
  .diapo.dessous .cadre-photo{box-shadow:0 .6vmin 1.6vmin rgba(27,38,82,.25)}
  .cadre-photo .media{position:relative;line-height:0;background:var(--perle)}
  .cadre-photo img,.cadre-photo video{display:block;max-width:min(52vw,calc(100vw - 40vmin));max-height:60vh;width:auto;height:auto;object-fit:contain}
  .cadre-photo img{min-width:28vmin;min-height:22vmin}
  .legende{position:absolute;right:1.6vmin;bottom:1.6vmin;max-width:min(70%,50vmin);background:rgba(252,251,248,.94);padding:.9vmin 1.4vmin;
    text-align:right;box-shadow:0 .3vmin 1.2vmin rgba(0,0,0,.2);line-height:1.3;transition:opacity 1s ease}
  .diapo.dessous .legende{opacity:0}
  .legende .mot{font-size:2.7vmin;font-style:italic;color:var(--encre);white-space:pre-wrap;margin-bottom:.4vmin;max-height:18vh;overflow:hidden}
  .legende .qui{font-size:1.6vmin;text-transform:uppercase;letter-spacing:.2em;color:var(--encre-douce)}
  .legende .qui .nom{font-family:"Cormorant Garamond",serif;font-style:italic;color:var(--bleu-nuit);font-size:3.1vmin;margin-left:.8vmin;letter-spacing:0;text-transform:none}
  .attente{padding:6vmin 8vmin;text-align:center}
  .attente .monogramme{font-size:14vmin}
  .attente .capitales{font-size:1.8vmin}
  .attente .italique{font-size:2.2vmin}
  .carton{padding:6vmin 7vmin;max-width:70vmin;text-align:center}
  .carton .texte{font-family:"Cormorant Garamond",serif;font-style:italic;font-size:3.6vmin;white-space:pre-wrap;color:var(--bleu-nuit)}
  .carton .signature{display:block;margin-top:2vmin;text-transform:uppercase;letter-spacing:.25em;font-size:1.5vmin}
  #aide{position:absolute;top:1vmin;left:50%;transform:translateX(-50%);font-size:1.3vmin;color:var(--encre-douce);opacity:.7;transition:opacity 1s}
  body.plein #aide{opacity:0}
  #pause{position:absolute;top:2vmin;right:18vmin;font-size:1.4vmin;text-transform:uppercase;letter-spacing:.3em;color:var(--bleu);display:none}
  body.enpause #pause{display:block}
  #etat-cache{position:absolute;left:1vmin;bottom:.5vmin;font-size:1vmin;color:var(--encre-douce);opacity:.5}
  #etat-cache.hors{color:var(--erreur);opacity:1}
</style>
</head>
<body>
<section id="scene" hidden>
  <span id="coins"></span>
  <div id="diapos"></div>
  <div class="bandeau"><span class="monogramme">M<span class="et">&amp;</span>O</span><span class="capitales">05.12.2026</span></div>
  <div id="qr-coin"><div id="qr"></div><div class="capitales">Partagez vos souvenirs</div></div>
  <div id="aide">F plein écran · espace pause · ← → naviguer · V vidéos oui/non · R actualiser · Ne rechargez pas la page pendant la soirée</div>
  <div id="pause">Pause</div>
  <div id="etat-cache"></div>
</section>

<script src="../assets/vendor/supabase.min.js"></script>
<script src="../assets/vendor/qrcode.min.js"></script>
<script src="../assets/commun.js?v=202611161200"></script>
<script>
Object.assign(CONFIG, { DUREE_PHOTO: 9000, DUREE_MOT: 11000, DUREE_VIDEO_MAX: 45000, RAFRAICHIR: 60000, MAX_TABLE: 16, CACHE_MAX_VIDEO: 100 * 1048576, CACHE_MAX_TOTAL: 1500 * 1048576 });
let items = [], connus = new Set(), file = [], nouveaux = [];
let position = -1, timer = null, enPause = false, avecVideos = true, premierChargement = true, courant = null;

$('#coins').outerHTML = motif('motif-a', 'coin hg') + motif('couv-gauche-bas', 'coin bd') + motif('colibri-droit', 'coin hd');
qrDans($('#qr'), urlSite('../souvenirs/'), 256);
demarrer();

async function demarrer(){
  $('#scene').hidden = false;
  await charger();
  setInterval(charger, CONFIG.RAFRAICHIR);
  suivant();
}

/* ---------- données ---------- */
const cache = new Map(), urls = new Map(), inutilisables = new Set(); let octetsCache = 0;
async function charger(){
  let data, error;
  try { ({ data, error } = await sb.from('mo_envois').select('*, fichiers:mo_fichiers(*)').order('created_at', { ascending: true })); }
  catch (e) { error = e; }
  if (error) { console.warn('hors ligne, on continue avec la mémoire', error.message || error); majEtatCache(items, true); return; }
  const liste = [];
  const fichiersImg = [];
  for (const e of data) {
    if (e.visible === false || e.supprime) continue;
    const nom = e.invite_nom || 'Un invité';
    if (e.message) liste.push({ id: 'm-' + e.id, type: 'mot', nom, texte: e.message, date: e.created_at });
    for (const f of e.fichiers) {
      if (f.visible === false || f.supprime) continue;
      const t = f.type_mime || '';
      if (/heic|heif/i.test(t + f.nom_original)) continue;   // les navigateurs ne savent pas l'afficher
      if (t.startsWith('image/')) { const it = { id: 'f-' + f.id, type: 'photo', nom, texte: f.message, chemin: f.chemin, taille: f.taille || 0, date: f.created_at }; liste.push(it); fichiersImg.push(it); }
      else if (t.startsWith('video/')) liste.push({ id: 'f-' + f.id, type: 'video', nom, texte: f.message, chemin: f.chemin, taille: f.taille || 0, date: f.created_at });
    }
  }
  // URLs signées (12 h), demandées une seule fois par média
  const media = liste.filter(i => i.chemin);
  const nouveauxMedias = media.filter(i => !urls.has(i.id));
  if (nouveauxMedias.length) {
    const { data: signes } = await sb.storage.from(CONFIG.BUCKET_SOUVENIRS).createSignedUrls(nouveauxMedias.map(i => i.chemin), 43200);
    nouveauxMedias.forEach((i, k) => urls.set(i.id, { url: signes && signes[k] ? signes[k].signedUrl : null }));
    // version réduite fabriquée au dépôt (apercus/1600/…) ; si elle manque, precharger() se rabat sur l'original
    const photos = nouveauxMedias.filter(i => i.type === 'photo');
    if (photos.length) {
      try {
        const { data: red } = await sb.storage.from(CONFIG.BUCKET_SOUVENIRS).createSignedUrls(photos.map(i => cheminApercu(i.chemin, APERCUS.GRAND)), 43200);
        photos.forEach((i, k) => { if (red && red[k] && red[k].signedUrl) urls.get(i.id).urlImg = red[k].signedUrl; });
      } catch {}
    }
  }
  media.forEach(i => { const u = urls.get(i.id) || {}; i.url = u.url; i.urlImg = u.urlImg; if (inutilisables.has(i.id)) i.inutilisable = true; });
  // Mise en mémoire en arrière-plan : la projection démarre tout de suite, les médias se téléchargent un par un.
  liste.forEach(i => { if (cache.has(i.id)) i.local = cache.get(i.id); });
  precharger(liste);
  majEtatCache(liste);
  const arrives = liste.filter(i => !connus.has(i.id));
  liste.forEach(i => connus.add(i.id));
  // ne garder en projection que ce qui est en mémoire (ou atteignable en ligne)
  items = liste;
  if (premierChargement) { premierChargement = false; file = melanger(items); }
  else if (!file.length && items.length) file = melanger(items);
  else if (arrives.length) { arrives.forEach(i => { i.nouveau = true; }); nouveaux.push(...arrives); }
  // retirer de la file ce qui n'est plus projetable
  const ids = new Set(items.map(i => i.id));
  file = file.filter(i => ids.has(i.id)).map(i => items.find(x => x.id === i.id));
}

let prechargeEnCours = false;
async function precharger(liste){
  if (prechargeEnCours) return; prechargeEnCours = true;
  // photos d'abord (rapides), vidéos ensuite
  // photos (réduites) d'abord ; vidéos ensuite, seulement les moins lourdes et tant que la mémoire le permet ; les autres se lisent en direct
  const aFaire = [...liste.filter(i => i.type === 'photo'), ...liste.filter(i => i.type === 'video' && i.taille <= CONFIG.CACHE_MAX_VIDEO)].filter(i => !i.local && i.url && !i.inutilisable);
  for (const i of aFaire) {
    if (octetsCache + (i.taille || 0) > CONFIG.CACHE_MAX_TOTAL && i.type === 'video') continue;
    try {
      const src = i.type === 'photo' && i.urlImg ? i.urlImg : i.url;
      let r = await fetch(src); if (!r.ok && i.urlImg) r = await fetch(i.url);
      if (!r.ok) { if (i.type === 'photo') { i.inutilisable = true; inutilisables.add(i.id); } continue; }
      const b = await r.blob(); const u = URL.createObjectURL(b);
      if (i.type === 'photo') {   // on vérifie que l'image se décode avant de la programmer (HEIC, fichier abîmé…)
        const ok = await new Promise(res => { const im = new Image(); im.onload = () => res(true); im.onerror = () => res(false); im.src = u; });
        if (!ok) { URL.revokeObjectURL(u); i.inutilisable = true; inutilisables.add(i.id); const v = items.find(x => x.id === i.id); if (v) v.inutilisable = true; continue; }
      }
      cache.set(i.id, u); octetsCache += b.size;
      const vivant = items.find(x => x.id === i.id); if (vivant) vivant.local = u; i.local = u;
    } catch (e) { console.warn('cache', i.chemin, e); }
    majEtatCache(items);
  }
  prechargeEnCours = false; majEtatCache(items);
}
function majEtatCache(liste, horsLigne){
  const n = liste.filter(i => i.local).length, tot = liste.length;
  const el = $('#etat-cache'); if (!el) return;
  el.className = (horsLigne || !navigator.onLine) ? 'hors' : '';
  el.textContent = `${n}/${tot} en mémoire (${(octetsCache/1048576).toFixed(0)} Mo)` + ((horsLigne || !navigator.onLine) ? ' · hors ligne, projection depuis la mémoire' : '');
}
window.addEventListener('offline', () => majEtatCache(items, true));
window.addEventListener('online', () => { majEtatCache(items); charger(); });
function melanger(a){ const b = [...a]; for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; }

/* ---------- lecture ---------- */
function prochain(){
  if (!navigator.onLine) { const enMem = file.filter(i => i.local); if (enMem.length && enMem.length < file.length) { file = enMem; position = -1; } }
  while (nouveaux.length) { const n = nouveaux.shift(); if (avecVideos || n.type !== 'video') { file.splice(position + 1, 0, n); return file[++position]; } }
  if (!file.length) return null;
  for (let k = 0; k < file.length; k++) {
    position = (position + 1) % file.length;
    if (position === 0) file = melanger(items);
    const it = file[position];
    if (it && !it.inutilisable && (avecVideos || it.type !== 'video')) return it;
  }
  return null;
}
function precedent(){
  if (!file.length) return null;
  position = (position - 1 + file.length) % file.length;
  return file[position];
}

function suivant(){ clearTimeout(timer); afficher(prochain()); }
function afficher(it){
  const cont = $('#diapos');
  // la table : la photo qui était au centre glisse vers un bord, plus petite ; au-delà de MAX_TABLE, les plus anciennes s'effacent
  const anciens = [...cont.children].filter(el => !el.classList.contains('sortie'));
  anciens.forEach((el, i) => {
    if (!el.classList.contains('dessous')) {
      el.classList.add('dessous');
      const v = el.querySelector('video'); if (v) v.pause();
      // direction au hasard, plutôt vers les bords, sans mordre sur les illustrations des côtés ni sur le QR code
      const a = Math.random() * Math.PI * 2, r = 0.65 + Math.random() * 0.35;
      let dx = Math.cos(a) * r * 22, dy = Math.sin(a) * r * 25;
      if (dx > 10 && dy > 8) dy = -dy;
      el.style.setProperty('--dx', dx.toFixed(1) + 'vw');
      el.style.setProperty('--dy', dy.toFixed(1) + 'vh');
      el.style.setProperty('--rot', ((Math.random() * 24) - 12).toFixed(1) + 'deg');
      el.style.setProperty('--s-dessous', (0.42 + Math.random() * 0.1).toFixed(2));
    }
    if (anciens.length - i > CONFIG.MAX_TABLE) { el.classList.add('sortie'); setTimeout(() => el.remove(), 1500); }
  });
  courant = it;
  const d = document.createElement('div'); d.className = 'diapo';
  if (!it) {
    cont.innerHTML = '';
    d.innerHTML = `<div class="attente carte-papier cadre"><div class="monogramme">M<span class="et">&amp;</span>O</div><div class="filet-or"><span>✦</span></div><p class="capitales">Vos photos, vidéos et mots apparaîtront ici</p><p class="italique doux">Scannez le code en bas à droite pour partager les vôtres</p></div>`;
    cont.appendChild(d); requestAnimationFrame(() => d.classList.add('visible'));
    timer = setTimeout(suivant, 8000); return;
  }
  const nouveau = ''; it.nouveau = false;
  let duree = CONFIG.DUREE_PHOTO;
  if (it.type === 'mot') {
    duree = Math.min(CONFIG.DUREE_MOT + it.texte.length * 40, 25000);
    d.innerHTML = nouveau + `<div class="carton carte-papier cadre"><div class="texte">${echap(it.texte)}</div><span class="signature">${echap(it.nom)}</span></div>`;
  } else {
    const media = it.type === 'photo'
      ? `<img src="${it.local || it.urlImg || it.url}" alt="" onerror="this.onerror=null;this.src='${it.url}'">`
      : `<video src="${it.local || it.url}" autoplay muted playsinline></video>`;
    d.innerHTML = `<div class="cadre-photo"><div class="media">${media}
        <div class="legende">${it.texte ? `<div class="mot">${echap(it.texte)}</div>` : ''}<div class="qui">par<span class="nom">${echap(it.nom)}</span></div></div>
      </div></div>`;
    if (it.type === 'video') {
      const v = d.querySelector('video');
      v.addEventListener('ended', () => { if (!enPause) suivant(); });
      v.addEventListener('error', () => suivant());
      duree = CONFIG.DUREE_VIDEO_MAX;
    }
  }
  // posée près du centre, légèrement de travers, comme lâchée sur la table
  d.style.setProperty('--rot', ((Math.random() * 7) - 3.5).toFixed(2) + 'deg');
  d.style.setProperty('--dx', ((Math.random() * 6) - 3).toFixed(2) + 'vmin');
  d.style.setProperty('--dy', ((Math.random() * 4) - 2).toFixed(2) + 'vmin');
  cont.appendChild(d);
  requestAnimationFrame(() => requestAnimationFrame(() => d.classList.add('visible')));
  if (!enPause) timer = setTimeout(suivant, duree);
}

/* ---------- commandes ---------- */
document.addEventListener('keydown', e => {
  if ($('#scene').hidden) return;
  switch (e.key) {
    case 'f': case 'F': pleinEcran(); break;
    case ' ': e.preventDefault(); enPause = !enPause; document.body.classList.toggle('enpause', enPause); if (enPause) clearTimeout(timer); else suivant(); break;
    case 'ArrowRight': suivant(); break;
    case 'ArrowLeft': clearTimeout(timer); afficher(precedent()); break;
    case 'v': case 'V': avecVideos = !avecVideos; $('#aide').textContent = avecVideos ? 'Vidéos activées' : 'Vidéos désactivées'; setTimeout(() => $('#aide').textContent = 'F plein écran · espace pause · ← → naviguer · V vidéos oui/non · R recharger', 2000); break;
    case 'r': case 'R': charger(); break;
  }
});
$('#scene').addEventListener('dblclick', pleinEcran);
function pleinEcran(){
  if (!document.fullscreenElement) { document.documentElement.requestFullscreen().catch(() => {}); }
  else document.exitFullscreen();
}
document.addEventListener('fullscreenchange', () => document.body.classList.toggle('plein', !!document.fullscreenElement));
</script>
</body>
</html>
