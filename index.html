<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Marie &amp; Olivier · 5 décembre 2026</title>
<link rel="stylesheet" href="assets/charte.css">
<style>
  main{max-width:1200px;margin:0 auto;padding:0 16px 0}

  /* ---- bandeau illustré au-dessus du titre ---- */
  .scene{position:relative;width:min(1100px,100%);margin:0 auto;aspect-ratio:1120/454;max-height:52vh;pointer-events:none}
  .scene .bande{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:bottom center}

  /* ---- ouverture du faire-part (plein écran, une fois par visite) ---- */
  #ouverture{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;background:var(--satin);perspective:1600px;overflow:hidden}
  #ouverture::before{content:"";position:absolute;inset:0;background:
    repeating-linear-gradient(118deg,rgba(255,255,255,.35) 0 1px,rgba(255,255,255,0) 1px 3px),
    radial-gradient(ellipse at 18% 0%,rgba(255,255,255,.95),transparent 55%),
    radial-gradient(ellipse at 92% 100%,rgba(214,208,194,.5),transparent 55%)}
  #ouverture,#ouverture::before{transition:background .1s}
  #ouverture.ouvre{background:transparent}
  #ouverture.ouvre::before{opacity:0;transition:opacity 1.3s ease .2s}
  #ouverture::before{transition:opacity 1.3s ease}
  #ouverture.fin{animation:fondu .7s ease forwards}
  @keyframes fondu{to{opacity:0;visibility:hidden}}
  .fp{position:relative;width:min(560px,86vw);aspect-ratio:1500/2016;transform-style:preserve-3d}
  .fp .face.recto{box-shadow:0 30px 50px rgba(27,38,82,.28)}
  .fp .volet{position:absolute;top:0;bottom:0;width:50%;transform-style:preserve-3d;transition:transform 1.6s cubic-bezier(.65,0,.35,1)}
  .fp .volet.g{left:0;transform-origin:left center}
  .fp .volet.d{right:0;transform-origin:right center}
  .fp.ouvert .volet.g{transform:rotateY(-158deg)}
  .fp.ouvert .volet.d{transform:rotateY(158deg)}
  .fp .face{position:absolute;inset:0;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden;
    background:linear-gradient(125deg,rgba(255,255,255,0) 30%,rgba(255,255,255,.9) 48%,rgba(255,255,255,0) 66%),repeating-linear-gradient(118deg,rgba(255,255,255,.4) 0 1px,rgba(255,255,255,0) 1px 3px),linear-gradient(160deg,#fdfcfa,#f3f0e8)}
  .fp .face.dos{transform:rotateY(180deg);background:linear-gradient(160deg,#fcfbf8,#f1eee6)}
  .fp .volet.g .face.dos{box-shadow:inset -14px 0 30px -20px rgba(27,38,82,.25)}
  .fp .volet.d .face.dos{box-shadow:inset 14px 0 30px -20px rgba(27,38,82,.25)}
  .fp .face img{position:absolute;pointer-events:none}
  .fp .g .m1{width:64%;left:-16%;top:-8%} .fp .g .m2{width:70%;left:-6%;bottom:-6%} .fp .g .m3{width:40%;right:-4%;bottom:22%}
  .fp .d .m1{width:88%;right:-10%;top:-3%} .fp .d .m2{width:80%;right:-4%;bottom:-3%} .fp .d .m3{width:40%;left:8%;top:38%}
  .fp .cartouche{position:absolute;left:54%;top:36%;transform:translate(-50%,-50%);text-align:center;white-space:nowrap}
  .fp .cartouche .capitales{font-size:.6rem;letter-spacing:.3em}
  .fp .cartouche .monogramme{font-size:clamp(2rem,7vw,3rem);margin:4px 0}
  .fp .cartouche .date{font-size:.62rem;letter-spacing:.28em}
  /* ruban gros-grain et nœud */
  .ruban{position:absolute;left:-6%;right:-6%;top:51%;height:7%;transform:translateY(-50%) translateZ(6px);
    background:repeating-linear-gradient(90deg,#1b2652 0 2px,#243271 2px 3px);box-shadow:0 6px 14px rgba(27,38,82,.35);transition:transform 1s cubic-bezier(.6,0,.8,.6),opacity .6s ease .5s}
  .fp.denoue .ruban{transform:translateY(60vh) rotate(-3deg) translateZ(6px);opacity:0}
  .noeud{position:absolute;left:42%;top:50%;width:52%;transform:translate(-50%,-50%) translateZ(8px);transform-origin:50% 40%;transition:transform .9s cubic-bezier(.6,0,.8,.6),opacity .5s ease .3s}
  .noeud svg{width:100%;height:auto;display:block;overflow:visible}
  .fp.denoue .noeud{transform:translate(-50%,-50%) translateZ(8px) scale(.2,1.3) translateY(120%);opacity:0}
  .noeud .boucle{transform-box:fill-box;transform-origin:center;animation:souffle 3s ease-in-out infinite alternate}
  .noeud .boucle.b{animation-delay:-1.5s}
  @keyframes souffle{to{transform:scale(1.03) rotate(1deg)}}
  #ouverture .passer{position:absolute;right:18px;bottom:16px;font:inherit;font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;background:none;border:0;color:var(--encre-douce);cursor:pointer}
  @media (prefers-reduced-motion:reduce){#ouverture{display:none}}

  /* ---- titre ---- */
  .tete{text-align:center;margin-top:-10px}
  .tete .monogramme{font-size:clamp(3.8rem,13vw,5.4rem)}
  .tete h1{font-size:clamp(1.9rem,6vw,2.6rem);font-style:italic;margin-top:8px}
  .tete .rebours{margin-top:10px}
  .intro{max-width:640px;margin:14px auto 0;text-align:center;color:var(--encre-douce)}
  .session{display:flex;justify-content:center;gap:10px;align-items:center;margin-top:14px;font-size:.92rem;min-height:34px}

  /* ---- sections ---- */
  section.groupe{margin-top:54px;position:relative}
  section.groupe > .motif-titre{display:block;width:min(420px,80vw);margin:0 auto 6px;height:70px;object-fit:contain;object-position:bottom}
  section.groupe > h2{font-size:2.1rem;text-align:center;font-style:italic}
  section.groupe > p{text-align:center;margin:4px auto 0;max-width:560px;color:var(--encre-douce)}
  .grille{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px;margin-top:24px}
  .fonction{padding:24px 20px 18px;display:flex;flex-direction:column;gap:9px;transition:transform .2s,box-shadow .2s;overflow:hidden;min-height:290px;cursor:pointer}
  .fonction:hover{transform:translateY(-3px);box-shadow:0 20px 44px rgba(27,38,82,.16)}
  .fonction .deco{position:absolute;right:-10px;top:-6px;width:46%;max-height:46%;object-fit:contain;object-position:top right;opacity:.95}
  .fonction h3{font-size:1.5rem;font-style:italic;margin-top:70px;position:relative}
  .fonction p{margin:0;font-size:.95rem;color:var(--encre-douce);flex:1;position:relative}
  .actions{display:flex;gap:6px;margin-top:8px;flex-wrap:nowrap;position:relative}
  .actions .btn{flex:1;padding:9px 4px;font-size:.6rem;letter-spacing:.06em;min-width:0}

  /* ---- QR ---- */
  dialog{border:0;padding:0;background:transparent;max-width:94vw}
  dialog::backdrop{background:rgba(27,38,82,.5)}
  .qr-carte{padding:30px 30px 24px;text-align:center;width:min(400px,92vw)}
  .qr-carte h3{font-size:1.7rem;font-style:italic}
  .qr-carte #qr{display:flex;justify-content:center;margin:16px 0 8px;padding:12px;background:#fff;border:1px solid var(--perle)}
  .qr-carte .aide{font-size:.88rem;color:var(--encre-douce);font-style:italic;margin:0 0 14px}
  .qr-carte .actions{flex-wrap:wrap;justify-content:center}
  .qr-carte .actions .btn{flex:none;font-size:.66rem;letter-spacing:.12em;padding:9px 14px}
  canvas#affiche{display:none}
</style>
</head>
<body>
<div id="ouverture" aria-hidden="true" hidden>
  <div class="fp" id="fp">
    <div class="volet g">
      <div class="face recto">
        <img class="m1 motif" src="assets/motifs/motif-a.png" alt=""><img class="m2 motif" src="assets/motifs/couv-gauche-bas.png" alt=""><img class="m3 motif" src="assets/motifs/colibri.png" alt="">
        <div class="cartouche"><p class="capitales">Notre Mariage</p><div class="monogramme">M<span class="et">&amp;</span>O</div><p class="capitales date">05.12.2026</p></div>
      </div>
      <div class="face dos"></div>
    </div>
    <div class="volet d">
      <div class="face recto">
        <img class="m1 motif" src="assets/motifs/couv-droite-haut.png" alt=""><img class="m2 motif" src="assets/motifs/oiseau-branche.png" alt=""><img class="m3 motif" src="assets/motifs/colibri.png" alt="" style="transform:scaleX(-1)">
      </div>
      <div class="face dos"></div>
    </div>
    <div class="ruban"></div>
    <div class="noeud">
      <svg viewBox="0 0 320 260" xmlns="http://www.w3.org/2000/svg">
        <defs><pattern id="gg" width="3" height="3" patternUnits="userSpaceOnUse"><rect width="3" height="3" fill="#1b2652"/><rect width="1" height="3" fill="#2b3b7c"/></pattern></defs>
        <!-- pans qui retombent, bouts en pointe -->
        <path d="M152 128 C 120 160, 96 200, 70 250 L 112 250 L 100 232 C 124 196, 146 164, 166 136 Z" fill="url(#gg)"/>
        <path d="M168 128 C 196 150, 232 170, 268 180 L 274 212 L 246 204 C 216 190, 186 168, 162 142 Z" fill="url(#gg)"/>
        <!-- boucles -->
        <g class="boucle a"><path d="M158 122 C 110 70, 30 74, 26 118 C 22 164, 96 170, 158 128 Z" fill="url(#gg)"/><path d="M152 122 C 110 92, 56 94, 48 118 C 56 146, 112 146, 150 124" fill="none" stroke="#0f1838" stroke-opacity=".45" stroke-width="4"/></g>
        <g class="boucle b"><path d="M162 122 C 206 60, 300 66, 298 112 C 296 160, 214 172, 162 128 Z" fill="url(#gg)"/><path d="M168 122 C 210 90, 268 90, 276 112 C 268 142, 212 146, 170 124" fill="none" stroke="#0f1838" stroke-opacity=".45" stroke-width="4"/></g>
        <!-- nœud central -->
        <path d="M136 104 C 148 98, 172 98, 184 104 C 194 118, 194 136, 184 148 C 170 156, 150 156, 136 148 C 126 136, 126 118, 136 104 Z" fill="#141d4a"/>
        <path d="M144 112 C 156 108, 166 108, 176 112 M 142 138 C 156 142, 166 142, 178 138" fill="none" stroke="#33438a" stroke-width="2.5"/>
      </svg>
    </div>
  </div>
  <button class="passer" id="passer">Passer</button>
</div>
<main>
  <div class="scene" aria-hidden="true">
    <img class="bande motif" src="assets/motifs/bande-bas.png" alt="">
  </div>
  <header class="tete">
    <p class="capitales">Notre mariage</p>
    <div class="monogramme">M<span class="et">&amp;</span>O</div>
    <h1>Marie &amp; Olivier</h1>
    <p class="capitales rebours" id="rebours"></p>
    <div class="filet-or"><span>✦</span></div>
  </header>

  <section class="groupe">
    <img class="motif motif-titre" src="assets/motifs/colibri-droit.png" alt="">
    <h2>Pour les invités</h2>
    <p class="italique">À envoyer aux invités ou à imprimer sur les tables.</p>
    <div class="grille" id="g-invites"></div>
  </section>

  <section class="groupe">
    <img class="motif motif-titre" src="assets/motifs/oiseau-branche.png" alt="" style="height:110px">
    <h2>Pour les organisateurs</h2>
    <p class="italique">Pour Marie, Olivier et ceux qui les aident. Ces liens restent entre nous.</p>
    <div class="grille" id="g-orga"></div>
  </section>

  <dialog id="dlg-qr">
    <div class="qr-carte carte-papier cadre">
      <h3 id="qr-titre"></h3>
      <div id="qr"></div>
      <p class="aide">Scannez-le avec un téléphone pour vérifier.</p>
      <div class="actions">
        <button class="btn" id="qr-affiche">Télécharger l'affiche à imprimer</button>
        <button class="btn clair" id="qr-fermer">Fermer</button>
      </div>
    </div>
  </dialog>
  <canvas id="affiche"></canvas>
</main>
<footer class="pied-bleu" id="pied"></footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="assets/commun.js"></script>
<script>
const FONCTIONS = [
  { groupe: 'invites', deco: 'colibri', titre: 'Souvenirs', chemin: 'souvenirs/', accroche: 'Partagez vos souvenirs',
    texte: 'Avant le grand jour, les invités déposent leurs photos, vidéos et petits mots. Ils seront projetés pendant la soirée.' },
  { groupe: 'invites', deco: 'couv-droite-haut', titre: 'Trouver ma table', chemin: 'plan-de-table/ma-place.html', accroche: 'Trouvez votre table',
    texte: 'Chaque invité tape son nom et découvre sa table et ses voisins.' },
  { groupe: 'invites', deco: 'motif-a', titre: 'Programme', chemin: 'programme/', accroche: 'Le programme',
    texte: 'Le déroulé de la journée, heure par heure.' },
  { groupe: 'orga', deco: 'colibri', titre: 'Souvenirs', chemin: 'souvenirs/admin.html', accroche: 'Souvenirs',
    texte: 'Tout ce que les invités ont déposé. Choisissez ce qui sera projeté, téléchargez tout en un clic.' },
  { groupe: 'orga', deco: 'couv-gauche-bas', titre: 'Projection', chemin: 'projection/', accroche: 'Projection',
    texte: 'Le diaporama de la soirée, à lancer sur l\'écran de la salle. Les nouveaux souvenirs y arrivent au fil de l\'eau.' },
  { groupe: 'orga', deco: 'oiseau-branche', titre: 'Plan de table', chemin: 'plan-de-table/', accroche: 'Plan de table',
    texte: 'La salle, les tables, les invités à leur place. Publiez-le quand il est prêt.' },
  { groupe: 'orga', deco: 'colibri-droit', titre: 'Planning détaillé', chemin: 'planning/', accroche: 'Le planning du week-end',
    texte: 'Le minute par minute du week-end : qui fait quoi, où et quand. Choisissez ce que les invités en voient.' }
];

/* Ouverture du faire-part : une fois par visite (sessionStorage) */
(function(){
  const ov = $('#ouverture'), fp = $('#fp');
  const deja = sessionStorage.getItem('fp-ouvert');
  if (deja || matchMedia('(prefers-reduced-motion: reduce)').matches) { ov.remove(); return; }
  ov.hidden = false; document.body.style.overflow = 'hidden';
  const fin = () => { ov.classList.add('fin'); document.body.style.overflow = ''; sessionStorage.setItem('fp-ouvert', '1'); setTimeout(() => ov.remove(), 800); };
  const t1 = setTimeout(() => fp.classList.add('denoue'), 1400);    // le nœud se défait, le ruban glisse
  const t2 = setTimeout(() => { fp.classList.add('ouvert'); ov.classList.add('ouvre'); }, 2500);    // les volets s'ouvrent, le site apparaît derrière
  const t3 = setTimeout(fin, 4300);
  $('#passer').onclick = () => { [t1, t2, t3].forEach(clearTimeout); fin(); };
})();

const jours = Math.ceil((new Date(CONFIG.DATE_ISO + 'T16:30') - new Date()) / 86400000);
$('#rebours').textContent = jours > 1 ? `J − ${jours} · ${CONFIG.DATE_LONGUE}` : jours === 1 ? 'C\'est demain !' : jours === 0 ? 'C\'est aujourd\'hui !' : CONFIG.DATE_LONGUE;

let fonctionQR = null;
for (const f of FONCTIONS) {
  const url = urlSite(f.chemin);
  const el = document.createElement('article');
  el.className = 'fonction carte-papier';
  el.innerHTML = `${motif(f.deco, 'deco')}
    <h3>${echap(f.titre)}</h3>
    <p>${echap(f.texte)}</p>
    <div class="actions">
      <button class="btn clair" data-copier>Copier le lien</button>
      <button class="btn clair" data-qr>QR code</button>
    </div>`;
  el.tabIndex = 0; el.setAttribute('role', 'link'); el.title = 'Ouvrir ' + f.titre;
  el.onclick = e => { if (e.target.closest('button')) return; window.open(url, '_blank', 'noopener'); };
  el.onkeydown = e => { if (e.key === 'Enter' && !e.target.closest('button')) window.open(url, '_blank', 'noopener'); };
  el.querySelector('[data-copier]').onclick = async e => {
    e.stopPropagation();
    try { await navigator.clipboard.writeText(url); toast('Lien copié'); } catch { prompt('Copiez ce lien :', url); }
  };
  el.querySelector('[data-qr]').onclick = e => {
    e.stopPropagation();
    fonctionQR = { ...f, url };
    $('#qr-titre').textContent = f.titre;
    qrDans($('#qr'), url, 220); $('#dlg-qr').showModal();
  };
  $('#g-' + f.groupe).appendChild(el);
}
$('#qr-fermer').onclick = () => $('#dlg-qr').close();
$('#qr-affiche').onclick = () => fonctionQR && affiche(fonctionQR);
$('#pied').innerHTML = piedBleu();

/* ---------- Affiche A5 à imprimer : QR code habillé aux couleurs du faire-part ---------- */
async function affiche(f){
  const W = 1748, H = 2480; // A5 à 300 dpi
  const c = $('#affiche'); c.width = W; c.height = H; const x = c.getContext('2d');
  try { await document.fonts.load('500 100px "Cormorant Garamond"'); await document.fonts.load('400 40px "EB Garamond"'); } catch {}
  const img = src => new Promise(r => { const i = new Image(); i.onload = () => r(i); i.onerror = () => r(null); i.src = src; });
  const [pg, pd, colib, oiseau, bas] = await Promise.all([img('assets/motifs/motif-a.png'), img('assets/motifs/couv-droite-haut.png'), img('assets/motifs/colibri.png'), img('assets/motifs/oiseau-branche.png'), img('assets/motifs/couv-gauche-bas.png')]);
  // papier satiné
  const g = x.createLinearGradient(0, 0, W, H); g.addColorStop(0, '#fdfcfa'); g.addColorStop(.45, '#f4f1ea'); g.addColorStop(.55, '#fbfaf7'); g.addColorStop(1, '#efebe2');
  x.fillStyle = g; x.fillRect(0, 0, W, H);
  // cadre fin bleu + filet
  x.strokeStyle = '#26356f'; x.lineWidth = 3; x.strokeRect(60, 60, W - 120, H - 120);
  x.strokeStyle = 'rgba(38,53,111,.35)'; x.lineWidth = 1.5; x.strokeRect(84, 84, W - 168, H - 168);
  // panneaux du faire-part à gauche et à droite
  const dessiner = (im, dx, dy, dw) => { if (!im) return; const dh = dw * im.height / im.width; x.drawImage(im, dx, dy, dw, dh); return dh; };
  if (pg) dessiner(pg, 110, 110, 330);
  if (pd) dessiner(pd, W - 110 - 380, 110, 380);
  if (bas) { x.save(); x.globalAlpha = .9; dessiner(bas, 110, 2000, 240); x.restore(); }
  // textes
  x.textAlign = 'center'; x.fillStyle = '#1e1e22';
  x.font = '500 46px "EB Garamond", Georgia, serif'; espacer(x, 'NOTRE MARIAGE', W / 2, 330, 18);
  x.font = '400 300px "Cormorant Garamond", Georgia, serif'; x.fillText('M', W / 2 - 170, 600); x.fillText('O', W / 2 + 170, 600);
  x.fillStyle = '#b8913f'; x.font = '400 120px "Cormorant Garamond", Georgia, serif'; x.fillText('&', W / 2, 560);
  x.fillStyle = '#1e1e22'; x.font = '500 44px "EB Garamond", Georgia, serif'; espacer(x, '05.12.2026', W / 2, 680, 14);
  // filet doré
  x.strokeStyle = '#d9bf7f'; x.lineWidth = 2; x.beginPath(); x.moveTo(W / 2 - 220, 740); x.lineTo(W / 2 - 40, 740); x.moveTo(W / 2 + 40, 740); x.lineTo(W / 2 + 220, 740); x.stroke();
  x.fillStyle = '#b8913f'; x.font = '40px serif'; x.fillText('✦', W / 2, 754);
  x.fillStyle = '#1e1e22'; let fs = 150; do { x.font = `italic 500 ${fs}px "Cormorant Garamond", Georgia, serif`; fs -= 6; } while (x.measureText(f.accroche).width > W - 420 && fs > 60); x.fillText(f.accroche, W / 2, 940);
  // QR sur carte blanche
  const qc = $('#qr canvas') || $('#qr img'); const taille = 820, qx = (W - taille) / 2, qy = 1040;
  x.save(); x.shadowColor = 'rgba(27,38,82,.18)'; x.shadowBlur = 40; x.shadowOffsetY = 16; x.fillStyle = '#fff'; x.fillRect(qx - 40, qy - 40, taille + 80, taille + 80); x.restore();
  x.strokeStyle = 'rgba(38,53,111,.3)'; x.lineWidth = 1.5; x.strokeRect(qx - 24, qy - 24, taille + 48, taille + 48);
  if (qc) { x.imageSmoothingEnabled = false; x.drawImage(qc, qx, qy, taille, taille); x.imageSmoothingEnabled = true; }
  if (colib) dessiner(colib, qx + taille - 20, qy - 150, 170);
  x.fillStyle = '#1e1e22'; x.font = '500 46px "EB Garamond", Georgia, serif'; espacer(x, 'SCANNEZ-MOI', W / 2, qy + taille + 100, 16);
  x.fillStyle = '#5c5c63'; x.font = 'italic 400 54px "EB Garamond", Georgia, serif'; x.textAlign = 'center'; x.fillText(f.titre === 'Souvenirs' ? 'Vos photos, vidéos et petits mots de la journée' : f.titre === 'Trouver ma table' ? 'Votre nom, votre table, vos voisins' : 'Avec l\'appareil photo de votre téléphone', W / 2, qy + taille + 170);
  if (oiseau) dessiner(oiseau, W - 110 - 240, 2000, 240);
  x.fillStyle = '#1e1e22'; x.font = '500 38px "EB Garamond", Georgia, serif'; espacer(x, 'SAMEDI 5 DÉCEMBRE 2026 · OUVROUER-LES-CHAMPS', W / 2, H - 118, 10);
  c.toBlob(b => telecharger(b, `affiche-${sansAccent(f.titre).replace(/[^a-z0-9]+/g, '-')}.png`), 'image/png');
  toast('Affiche A5 téléchargée : à imprimer, puis découper le long du cadre.', 3500);
}
function espacer(x, txt, cx, y, esp){
  const largeurs = [...txt].map(ch => x.measureText(ch).width); const total = largeurs.reduce((a, b) => a + b, 0) + esp * (txt.length - 1);
  let px = cx - total / 2; x.textAlign = 'left';
  [...txt].forEach((ch, i) => { x.fillText(ch, px, y); px += largeurs[i] + esp; });
  x.textAlign = 'center';
}

</script>
</body>
</html>
