<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Marie &amp; Olivier</title>
<link rel="icon" type="image/png" href="../assets/favicon.png">
<link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
<link rel="stylesheet" href="../assets/charte.css?v=202610241753">
<style>
  main{max-width:1000px;margin:0 auto;padding:10px 16px 60px}
  .barre-outils{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:20px 0}
  .barre-outils .spacer{flex:1}
  .stat{color:var(--encre-douce);font-style:italic}
  .envoi{padding:18px 20px 14px;margin-top:18px}
  .envoi header{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:baseline}
  .envoi h2{font-size:1.5rem}
  .envoi .date{color:var(--encre-douce);font-style:italic;font-size:.95rem}
  .mot{background:#fff;border-left:2px solid var(--or-clair);padding:8px 12px;white-space:pre-wrap;font-style:italic}
  .msg{color:var(--encre-douce);font-style:italic}
  .vide{text-align:center;color:var(--encre-douce);font-style:italic;margin:40px 0}
  .galerie{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px;margin-top:12px}
  .carte{background:#fff;border:1px solid var(--perle);display:flex;flex-direction:column}
  .carte .apercu{aspect-ratio:1;background:var(--perle);display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:zoom-in;color:var(--bleu);text-transform:uppercase;letter-spacing:.12em;font-size:.75rem}
  .carte .apercu img,.carte .apercu video{width:100%;height:100%;object-fit:cover;display:block}
  .carte .infos{padding:8px 10px;font-size:.88rem;flex:1}
  .carte .infos .nom{word-break:break-all}
  .carte .actions{display:flex;gap:6px;padding:0 10px 10px;align-items:center;flex-wrap:wrap}
  @media (pointer:coarse){ .lien-modif,.interrupteur,.carte .actions a,.carte .actions button{min-height:36px;padding:6px 10px} .galerie{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))} }
  .carte .actions a,.carte .actions button{font:inherit;font-size:.72rem;text-transform:uppercase;letter-spacing:.12em;background:none;border:0;padding:4px 0;cursor:pointer;color:var(--bleu);text-decoration:none}
  .carte .actions .suppr{margin-left:auto;color:var(--encre-douce)}
  .carte .actions .suppr:hover{color:var(--erreur)}
  .carte.supprime{opacity:.35;pointer-events:none}
  .carte.masque .apercu{filter:grayscale(1) opacity(.45)}
  .interrupteur{font:inherit;font-size:.7rem;text-transform:uppercase;letter-spacing:.12em;border:1px solid var(--perle-fonce);background:transparent;color:var(--encre-douce);padding:3px 8px;cursor:pointer;border-radius:20px}
  .interrupteur.actif{border-color:var(--ok);color:var(--ok)}
  .lien-modif{font:inherit;font-size:.72rem;text-transform:uppercase;letter-spacing:.12em;background:none;border:0;color:var(--bleu);cursor:pointer;padding:0}
  .mot-ligne{display:flex;gap:10px;align-items:flex-start;margin:10px 0}
  .mot-ligne .mot{flex:1;margin:0}
  .envoi header .actions-envoi{display:flex;gap:8px;align-items:center}
  #visionneuse{position:fixed;inset:0;background:rgba(27,38,82,.94);display:flex;align-items:center;justify-content:center;z-index:9;padding:20px}
  #visionneuse img,#visionneuse video{max-width:100%;max-height:88vh;box-shadow:0 0 40px #0008}
  #visionneuse .fermer{position:absolute;top:14px;right:18px;font-size:2rem;color:#fff;background:none;border:0;cursor:pointer}
  #visionneuse .legende{position:absolute;bottom:14px;left:0;right:0;text-align:center;color:#fff;font-style:italic}
</style>
</head>
<body>
<header id="bandeau"></header>
<main>
  <section id="app">
    <p class="capitales" style="margin-top:20px">Ce que les invités ont déposé</p>
    <h1 style="font-size:2.2rem;font-style:italic">Les souvenirs</h1>
    <p class="doux" style="margin:6px 0 0">Tout est projeté par défaut. Passez en « Non projeté » ce que vous préférez garder pour vous, ajoutez ou corrigez un mot, téléchargez l'ensemble. Ce que vous supprimez va dans la corbeille, rien n'est perdu.</p>
    <div class="barre-outils">
      <button class="btn petit" id="btn-zip">Tout télécharger (zip)</button>
      <button class="btn clair petit" id="btn-csv">Exporter les mots (CSV)</button>
      <button class="btn clair petit" id="btn-refresh">Actualiser</button>
      <button class="btn clair petit" id="btn-corbeille">Corbeille</button>
      
      <span class="spacer"></span>
      <span class="stat" id="stat"></span>
    </div>
    <p class="msg" id="info"></p>
    <div id="liste"></div>
  </section>
  <div id="visionneuse" hidden><button class="fermer" aria-label="Fermer">×</button><div id="vis-contenu"></div><div class="legende" id="vis-legende"></div></div>
</main>

<script src="../assets/vendor/supabase.min.js"></script>
<script src="../assets/vendor/jszip.min.js"></script>
<script src="../assets/commun.js?v=202610241753"></script>
<script>
let envois = [], tous = [], corbeille = false;
$('#btn-corbeille').onclick = () => { corbeille = !corbeille; rendreListe(); };
$('#btn-refresh').onclick = charger;
(async () => {
  bandeauOrga($('#bandeau'), { titre: 'Souvenirs', actions: '<a class="btn petit clair" href="../projection/" target="_blank" rel="noopener">Lancer la projection</a>',
    publication: await publicationReglage('depot_souvenirs', 'Dépôt des invités', 'Publié : les invités peuvent déposer leurs souvenirs. Non publié : la page leur dit que le dépôt est fermé.', null) });
  charger();
})();

async function charger(){
  $('#info').textContent = 'Chargement...';
  const { data, error } = await sb.from('mo_envois').select('*, fichiers:mo_fichiers(*)').order('created_at', { ascending: false });
  if (error) { $('#info').textContent = 'Erreur : ' + error.message; return; }
  tous = data; $('#info').textContent = '';
  rendreListe();
}
async function rendreListe(){
  // corbeille : envois supprimés, ou fichiers supprimés d'envois conservés
  envois = tous.filter(e => corbeille ? (e.supprime || e.fichiers.some(f => f.supprime)) : !e.supprime).map(e => ({ ...e, fichiers: e.fichiers.filter(f => corbeille ? (e.supprime || f.supprime) : !f.supprime) }));
  const nbCorb = tous.filter(e => e.supprime).length + tous.filter(e => !e.supprime).reduce((a, e) => a + e.fichiers.filter(f => f.supprime).length, 0);
  $('#btn-corbeille').textContent = corbeille ? 'Retour aux souvenirs' : `Corbeille${nbCorb ? ' (' + nbCorb + ')' : ''}`;
  majStat();
  const cont = $('#liste'); cont.innerHTML = '';
  if (corbeille) cont.innerHTML = '<p class="msg">Ce qui est ici n\'est ni projeté ni compté. Vous pouvez tout restaurer. Rien n\'est effacé définitivement : le ménage se fera après le mariage.</p>';
  if (!envois.length) { cont.insertAdjacentHTML('beforeend', `<p class="vide">${corbeille ? 'La corbeille est vide.' : 'Rien pour le moment : les souvenirs des invités apparaîtront ici dès le premier envoi.'}</p>`); return; }
  for (const e of envois) {
    const sec = document.createElement('section'); sec.className = 'envoi carte-papier';
    sec.innerHTML = `<header><h2>${echap(e.invite_nom || 'Invité anonyme')} <button class="lien-modif" data-modif-nom>modifier</button></h2><span class="date">${dateFr(e.created_at)} · ${e.appareil || ''}</span><span class="actions-envoi"><button class="interrupteur ${e.visible !== false ? 'actif' : ''}" data-vis-envoi>${e.visible !== false ? 'Projeté' : 'Non projeté'}</button><button class="btn clair petit" data-suppr-envoi>${corbeille && e.supprime ? 'Restaurer l\'envoi' : 'Supprimer l\'envoi'}</button></span></header>`
      + `<div class="mot-ligne">${e.message ? `<div class="mot">${echap(e.message)}</div>` : '<span class="msg">Pas de mot global.</span>'}<button class="lien-modif" data-modif-mot>${e.message ? 'modifier' : 'ajouter'}</button></div>`;
    sec.querySelector('[data-modif-nom]').onclick = async () => {
      const v = prompt('Nom affiché avec ces souvenirs :', e.invite_nom || ''); if (v === null) return;
      const { error } = await sb.from('mo_envois').update({ invite_nom: v.trim() || null }).eq('id', e.id); if (error) { alert(error.message); return; } charger();
    };
    sec.querySelector('[data-modif-mot]').onclick = async () => {
      const v = prompt('Mot de l\'invité (laisser vide pour ne pas l\'afficher) :', e.message || ''); if (v === null) return;
      const { error } = await sb.from('mo_envois').update({ message: v.trim() || null }).eq('id', e.id); if (error) { alert(error.message); return; } charger();
    };
    sec.querySelector('[data-vis-envoi]').onclick = async () => {
      const vis = e.visible === false;
      const { error } = await sb.from('mo_envois').update({ visible: vis }).eq('id', e.id); if (error) { alert(error.message); return; } charger();
    };
    sec.querySelector('[data-suppr-envoi]').onclick = async () => {
      const restaurer = corbeille && e.supprime;
      if (!restaurer && !confirm(`Mettre à la corbeille tout l'envoi de ${e.invite_nom || 'cet invité'} (${e.fichiers.length} fichier(s)) ? Il ne sera plus projeté ; vous pourrez le restaurer.`)) return;
      const { error } = await sb.from('mo_envois').update({ supprime: !restaurer }).eq('id', e.id); if (error) { alert(erreurBase(error)); return; }
      charger();
    };
    if (e.fichiers.length) {
      const gal = document.createElement('div'); gal.className = 'galerie';
      e.fichiers.sort((a, b) => a.created_at.localeCompare(b.created_at));
      // vignettes réduites (400 px) : l'original n'est chargé qu'en plein écran ou au téléchargement
      const signes = await Promise.all(e.fichiers.map(f => sb.storage.from(CONFIG.BUCKET_SOUVENIRS).createSignedUrl(f.chemin, 3600, (f.type_mime || '').startsWith('image/') ? { transform: { width: 400, quality: 70 } } : undefined).then(r => r.data).catch(() => null)));
      e.fichiers.forEach((f, i) => {
        const url = signes && signes[i] && signes[i].signedUrl;
        const carte = document.createElement('div'); carte.className = 'carte';
        const ap = document.createElement('div'); ap.className = 'apercu';
        const type = f.type_mime || '';
        if (type.startsWith('image/') && url) { const img = document.createElement('img'); img.loading = 'lazy'; img.src = url; img.alt = ''; img.onerror = () => { ap.textContent = 'aperçu indisponible'; }; ap.appendChild(img); }
        else if (type.startsWith('video/') && url) { const v = document.createElement('video'); v.src = url; v.muted = true; v.preload = 'none'; v.playsInline = true; ap.appendChild(v); }
        else ap.textContent = /heic|heif/i.test(type + f.nom_original) ? 'HEIC · non projetable' : type.startsWith('audio/') ? 'audio' : 'fichier';
        ap.onclick = async () => { const { data } = await sb.storage.from(CONFIG.BUCKET_SOUVENIRS).createSignedUrl(f.chemin, 3600); voir(f, data && data.signedUrl); };
        const infos = document.createElement('div'); infos.className = 'infos';
        infos.innerHTML = `<div class="nom">${echap(f.nom_original)}</div><div class="msg">${taille(f.taille || 0)}</div>` + (f.message ? `<div class="mot" style="margin:6px 0 0;padding:4px 8px">${echap(f.message)}</div>` : '');
        if (f.visible === false) carte.classList.add('masque');
        const ligne2 = document.createElement('div'); ligne2.className = 'actions';
        const inter = document.createElement('button'); inter.className = 'interrupteur' + (f.visible === false ? '' : ' actif'); inter.textContent = f.visible === false ? 'Non projeté' : 'Projeté';
        inter.onclick = async () => { const vis = f.visible === false; const { error } = await sb.from('mo_fichiers').update({ visible: vis }).eq('id', f.id); if (error) { alert(error.message); return; } f.visible = vis; inter.className = 'interrupteur' + (vis ? ' actif' : ''); inter.textContent = vis ? 'Projeté' : 'Non projeté'; carte.classList.toggle('masque', !vis); majStat(); };
        const mod = document.createElement('button'); mod.className = 'lien-modif'; mod.textContent = f.message ? 'modifier le mot' : 'ajouter un mot'; mod.style.marginLeft = 'auto';
        mod.onclick = async () => { const v = prompt('Mot affiché sous ce souvenir :', f.message || ''); if (v === null) return; const { error } = await sb.from('mo_fichiers').update({ message: v.trim() || null }).eq('id', f.id); if (error) { alert(error.message); return; } charger(); };
        ligne2.append(inter, mod);
        const act = document.createElement('div'); act.className = 'actions';
        const dl = document.createElement('a'); dl.href = '#'; dl.textContent = 'Télécharger';
        dl.onclick = async ev => { ev.preventDefault(); const { data, error } = await sb.storage.from(CONFIG.BUCKET_SOUVENIRS).createSignedUrl(f.chemin, 3600, { download: f.nom_original }); if (error) { alert(error.message); return; } window.open(data.signedUrl, '_blank'); };
        const sup = document.createElement('button'); sup.className = 'suppr'; sup.textContent = corbeille ? 'Restaurer' : 'Supprimer';
        sup.onclick = async () => {
          if (!corbeille && !confirm(`Mettre « ${f.nom_original} » à la corbeille ? Vous pourrez le restaurer.`)) return;
          const { error } = await sb.from('mo_fichiers').update({ supprime: !corbeille }).eq('id', f.id); if (error) { alert(erreurBase(error)); return; }
          charger();
        };
        act.append(dl, sup); carte.append(ap, infos, ligne2, act); gal.appendChild(carte);
      });
      sec.appendChild(gal);
    } else sec.insertAdjacentHTML('beforeend', `<p class="msg">${e.nb_fichiers > 0 && !corbeille ? `Envoi interrompu : ${e.nb_fichiers} fichier${e.nb_fichiers > 1 ? 's' : ''} attendu${e.nb_fichiers > 1 ? 's' : ''}, aucun reçu.` : e.message ? 'Un mot, sans photo.' : 'Envoi vide.'}</p>`);
    cont.appendChild(sec);
  }
}

function erreurBase(err){ return /supprime/.test(err.message) ? 'La base de données n\'est pas encore à jour : la corbeille sera disponible après l\'exécution du fichier supabase/migrations/20261024_mo_garde_fous.sql (voir le README).' : err.message; }
function majStat(){
  const vivants = tous.filter(e => !e.supprime).map(e => ({ ...e, fichiers: e.fichiers.filter(f => !f.supprime) }));
  const nbF = vivants.reduce((a, e) => a + e.fichiers.length, 0);
  const vol = vivants.reduce((a, e) => a + e.fichiers.reduce((b, f) => b + (f.taille || 0), 0), 0);
  const proj = vivants.filter(e => e.visible !== false).reduce((a, e) => a + e.fichiers.filter(f => f.visible !== false).length, 0);
  const mots = vivants.filter(e => e.message).length;
  $('#stat').textContent = `${vivants.length} envoi${vivants.length > 1 ? 's' : ''}, ${nbF} fichier${nbF > 1 ? 's' : ''}, ${taille(vol)} · ${proj} projeté${proj > 1 ? 's' : ''}${mots ? ` · ${mots} mot${mots > 1 ? 's' : ''}` : ''}`;
}

/* Visionneuse plein écran */
function voir(f, url){
  if (!url) return;
  const c = $('#vis-contenu'); c.innerHTML = '';
  const type = f.type_mime || '';
  if (type.startsWith('image/')) { const img = document.createElement('img'); img.src = url; c.appendChild(img); }
  else if (type.startsWith('video/')) { const v = document.createElement('video'); v.src = url; v.controls = true; v.autoplay = true; v.playsInline = true; c.appendChild(v); }
  else { window.open(url, '_blank'); return; }
  $('#vis-legende').textContent = f.nom_original + (f.message ? ' · ' + f.message : '');
  $('#visionneuse').hidden = false;
}
$('#visionneuse .fermer').onclick = fermerVis;
$('#visionneuse').addEventListener('click', ev => { if (ev.target === $('#visionneuse')) fermerVis(); });
document.addEventListener('keydown', ev => { if (ev.key === 'Escape') fermerVis(); });
function fermerVis(){ $('#visionneuse').hidden = true; $('#vis-contenu').innerHTML = ''; }

$('#btn-zip').onclick = async () => {
  const btn = $('#btn-zip'); btn.disabled = true;
  const zip = new JSZip(); let n = 0, total = envois.reduce((a, e) => a + e.fichiers.length, 0);
  const lignes = [['Date', 'Invité', 'Appareil', 'Mot global', 'Fichier', 'Mot fichier']];
  for (const e of envois) {
    const dossier = zip.folder(`${e.created_at.slice(0, 16).replace(/[:T]/g, '-')}_${(e.invite_nom || 'anonyme').replace(/[^\w-]+/g, '_')}`);
    if (e.message) dossier.file('mot.txt', e.message);
    if (!e.fichiers.length) lignes.push([e.created_at, e.invite_nom || '', e.appareil || '', e.message || '', '', '']);
    for (const f of e.fichiers) {
      lignes.push([e.created_at, e.invite_nom || '', e.appareil || '', e.message || '', f.nom_original, f.message || '']);
      $('#info').textContent = `Préparation du zip : ${++n} / ${total}`;
      const { data, error } = await sb.storage.from(CONFIG.BUCKET_SOUVENIRS).download(f.chemin);
      if (error) { dossier.file(f.nom_original + '.ERREUR.txt', error.message); continue; }
      dossier.file(f.nom_original, data);
    }
  }
  zip.file('recapitulatif.csv', csv(lignes));
  $('#info').textContent = 'Compression...';
  const blob = await zip.generateAsync({ type: 'blob' });
  telecharger(blob, 'souvenirs-marie-olivier.zip');
  $('#info').textContent = ''; btn.disabled = false;
};

$('#btn-csv').onclick = () => {
  const lignes = [['Date', 'Invité', 'Appareil', 'Mot global', 'Fichier', 'Mot fichier']];
  for (const e of envois) {
    if (!e.fichiers.length) lignes.push([e.created_at, e.invite_nom || '', e.appareil || '', e.message || '', '', '']);
    for (const f of e.fichiers) lignes.push([e.created_at, e.invite_nom || '', e.appareil || '', e.message || '', f.nom_original, f.message || '']);
  }
  telecharger(new Blob(['\ufeff' + csv(lignes)], { type: 'text/csv;charset=utf-8' }), 'mots-invites.csv');
};

function csv(l){ return l.map(r => r.map(v => '"' + String(v).replace(/"/g, '""') + '"').join(';')).join('\r\n'); }
function dateFr(iso){ return new Date(iso).toLocaleString('fr-FR', { dateStyle: 'medium', timeStyle: 'short' }); }
</script>
</body>
</html>
